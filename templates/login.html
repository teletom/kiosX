<!DOCTYPE html>
<html lang="de" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>kiosX &ndash; Anmeldung ({{ info.device_id }})</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 1.25rem;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    main.login-card {
      width: min(420px, 100%);
      margin: 0;
    }

    article {
      border-radius: 0.9rem;
      padding: 1.75rem 1.6rem;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.14);
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }

    .brand-row h1 {
      margin: 0;
      font-size: 1.65rem;
    }

    .id-pill {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      padding: 0.25rem 0.65rem;
      border-radius: 0.45rem;
      background: #1d4ed8;
      color: #ffffff;
    }

    .subtitle {
      font-size: 0.88rem;
      opacity: 0.78;
      margin-bottom: 1.25rem;
    }

    .err-box {
      padding: 0.7rem 0.85rem;
      border-radius: 0.5rem;
      margin-bottom: 1rem;
      background: rgba(220, 38, 38, 0.12);
      border-left: 4px solid #dc2626;
      color: #b91c1c;
      font-size: 0.9rem;
      font-weight: 600;
    }

    input#pin {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 1.35rem;
      letter-spacing: 0.25em;
      text-align: center;
    }

    .hint {
      font-size: 0.8rem;
      opacity: 0.7;
      text-align: center;
      margin-top: 0.85rem;
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <main class="login-card">
    <article>
      <div class="brand-row">
        <h1>kiosX</h1>
        <span class="id-pill">{{ info.device_id }}</span>
      </div>
      <p class="subtitle">
        {{ info.hostname }} &middot; LAN/WLAN-Zugriff erfordert den Zugangscode.
      </p>

      {% if error %}
      <div class="err-box" role="alert">{{ error }}</div>
      {% endif %}

      <form method="post" action="/login">
        <input type="hidden" name="next" value="{{ next_url }}">
        <label for="pin">
          Zugangscode
          <input
            type="password"
            id="pin"
            name="pin"
            inputmode="numeric"
            autocomplete="one-time-code"
            placeholder="••••••"
            required
            autofocus
          >
        </label>
        <button type="submit" style="width: 100%; margin-bottom: 0;">Anmelden</button>
      </form>

      <p class="hint">
        &Uuml;ber Tailscale ist kein Code erforderlich.
      </p>
    </article>
  </main>
</body>
</html>
